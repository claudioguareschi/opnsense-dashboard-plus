[flow.snapshot]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/flow_snapshot.py
parameters:%s %s
type:script_output
message:Read the latest Firewall Map flow summary
allowed_groups:wheel,wwwonly

[geodb.status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_geodb.py status
parameters:
type:script_output
message:Requesting Firewall Map geolocation database status

[geodb.update]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_geodb.py update
parameters:
type:script_output
message:Updating Firewall Map geolocation database
description:Update Firewall Map+ geolocation database

[geodb.refresh]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_geodb.py update force
parameters:
type:script_output
message:Downloading Firewall Map geolocation database

[investigate]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_investigate.py
parameters:%s
type:script_output
message:Investigating an address for Firewall Map

[tables]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_collector.py tables
parameters:
type:script_output
message:Listing Firewall Map threat list candidates

[abuseipdb.update]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_abuseipdb.py update
parameters:
type:script_output
message:Updating the AbuseIPDB blacklist for Firewall Map
description:Update Firewall Map+ AbuseIPDB blacklist

[abuseipdb.refresh]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_abuseipdb.py update force
parameters:
type:script_output
message:Downloading the AbuseIPDB blacklist for Firewall Map

[abuseipdb.status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_abuseipdb.py status
parameters:
type:script_output
message:Requesting the Firewall Map AbuseIPDB blacklist status

[start]
command:/usr/local/etc/rc.d/firewallmap onestart
parameters:
type:script
message:Starting Firewall Map collector

[stop]
command:/usr/local/etc/rc.d/firewallmap onestop
parameters:
type:script
message:Stopping Firewall Map collector

[restart]
command:/usr/local/etc/rc.d/firewallmap onerestart
parameters:
type:script
message:Restarting Firewall Map collector

[status]
command:/usr/local/etc/rc.d/firewallmap onestatus; exit 0
parameters:
type:script_output
message:Requesting Firewall Map collector status

[threats.list]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_threats.py list
parameters:%s
type:script_output
message:Listing the Firewall Map threat review queue

[threats.set]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_threats.py set
parameters:%s %s %s
type:script_output
message:Updating the Firewall Map threat review queue

[ensure]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_collector.py ensure
parameters:
type:script
message:Starting the Firewall Map collector when threat recording is wanted
description:Keep Firewall Map+ threat recording running

[ids.stats]
command:/bin/cat /var/run/firewallmap/ids_stats.json
parameters:
type:script_output
message:Reading Firewall Map Suricata correlation statistics

[threats.bulk]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_threats.py bulk
parameters:%s %s
type:script_output
message:Changing the status of Firewall Map review queue entries

[threats.purge]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/firewallmap_threats.py purge
parameters:%s
type:script_output
message:Deleting dismissed or reviewed Firewall Map review queue entries
