[flow.snapshot]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/FirewallMap/flow_snapshot.py
parameters:
type:script_output
message:Read the latest Firewall Map flow summary
allowed_groups:wheel,wwwonly

[start]
command:/usr/local/etc/rc.d/firewallmap start
parameters:
type:script
message:Starting Firewall Map collector

[stop]
command:/usr/local/etc/rc.d/firewallmap stop
parameters:
type:script
message:Stopping Firewall Map collector

[restart]
command:/usr/local/etc/rc.d/firewallmap restart
parameters:
type:script
message:Restarting Firewall Map collector

[status]
command:/usr/local/etc/rc.d/firewallmap status; exit 0
parameters:
type:script_output
message:Requesting Firewall Map collector status
