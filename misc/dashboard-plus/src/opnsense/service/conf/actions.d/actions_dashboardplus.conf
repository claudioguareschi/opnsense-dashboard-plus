[system.info]
command:/usr/local/opnsense/scripts/OPNsense/DashboardPlus/system_info.py
parameters:
type:script_output
message:Collect Dashboard Plus hardware information
allowed_groups:wheel,wwwonly

[system.metrics]
command:/usr/local/opnsense/scripts/OPNsense/DashboardPlus/metrics.sh
parameters:
type:script_output
message:Collect Dashboard Plus system metrics
allowed_groups:wheel,wwwonly
cache_ttl:5

[system.interfaces]
command:/usr/local/opnsense/scripts/OPNsense/DashboardPlus/interfaces.php
parameters:
type:script_output
message:Collect Dashboard Plus interface status
allowed_groups:wheel,wwwonly
cache_ttl:5

[dns.queries]
command:/usr/local/sbin/unbound-control -c /var/unbound/unbound.conf stats_noreset
parameters:
type:script_output
message:Read the Unbound query counter for DNS Health+
allowed_groups:wheel,wwwonly
cache_ttl:1

[system.carp]
command:/usr/local/opnsense/scripts/OPNsense/DashboardPlus/carp.sh
parameters:
type:script_output
message:Collect Dashboard Plus CARP status
allowed_groups:wheel,wwwonly

[system.carp.history]
command:/usr/local/opnsense/scripts/OPNsense/DashboardPlus/carp_history.sh
parameters:
type:script_output
message:Collect Dashboard Plus CARP history
allowed_groups:wheel,wwwonly
cache_ttl:30

[system.qat]
command:/sbin/sysctl -i -e dev.qat dev.qat_ocf
parameters:
type:script_output
message:Collect Dashboard Plus QuickAssist metrics
allowed_groups:wheel,wwwonly
